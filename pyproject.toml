[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bencode"
version = "0.1.0"
description = "Strict, dependency-free BitTorrent-style bencode encoder/decoder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["bencode", "bittorrent", "torrent", "encoder", "decoder", "serialization"]
authors = [
    { name = "nripankadas07" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nripankadas07/bencode"
Source = "https://github.com/nripankadas07/bencode"
Issues = "https://github.com/nripankadas07/bencode/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bencode = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PYI", "RET", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bencode"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["bencode"]

[tool.coverage.report]
show_missing = true
skip_covered = true
