[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bencode"
version = "0.1.0"
description = "Strict, dependency-free BitTorrent-style bencode encoder/decoder."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["bencode", "bittorrent", "torrent", "encoder", "decoder", "serialization"]
authors = [
    { name = "nripankadas07" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nripankadas07/bencode"
Source = "https://github.com/nripankadas07/bencode"
Issues = "https://github.com/nripankadas07/bencode/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bencode = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src/bencode"]
